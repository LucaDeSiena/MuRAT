name: test
on: [push, pull_request]

jobs:
  test_on_ubuntu:
    name: test_on_ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave octave-signal octave-io

      - name: Run MuRAT smoke tests
        run: |
          cd ${{ github.workspace }}
          octave --no-gui --eval "
            addpath(pwd);
            addpath(fullfile(pwd, 'bin'));
            addpath(fullfile(pwd, 'Utilities_Matlab'));
            addpath(fullfile(pwd, 'Utilities_Matlab', 'MatSAC'));
            addpath(fullfile(pwd, 'Utilities_Matlab', 'MyUtilities'));

            requiredFiles = {
              'Utilities_Matlab/MyUtilities/Murat_test.m';
              'Utilities_Matlab/MyUtilities/Murat_testAll.m';
              'bin/Murat_testData.m';
              'bin/Murat_checks.m';
              'Utilities_Matlab/MatSAC/sac.m';
              'Utilities_Matlab/MatSAC/sachdr.m'
            };

            for i = 1:length(requiredFiles)
              if ~isfile(requiredFiles{i})
                error(['Missing required file: ' requiredFiles{i}]);
              end
            end

            requiredFunctions = {'Murat_test'; 'Murat_testAll'; 'Murat_testData'};
            for i = 1:length(requiredFunctions)
              if exist(requiredFunctions{i}, 'file') ~= 2
                error(['Required function not found: ' requiredFunctions{i}]);
              end
            end

            fid = fopen('bin/Murat_testData.m', 'r');
            if fid == -1
              error('Cannot open bin/Murat_testData.m');
            end
            content = fread(fid, '*char');
            fclose(fid);
            content = char(content.');

            hasFlagReturn = ~isempty(strfind(content, 'function [muratHeader,flag]'));
            hasFlagInit = ~isempty(strfind(content, 'flag = []')) || ...
                         ~isempty(strfind(content, 'flag=[]')) || ...
                         ~isempty(strfind(content, 'flag = 0')) || ...
                         ~isempty(strfind(content, 'flag=0'));

            if ~hasFlagReturn
              error('Murat_testData.m must return [muratHeader, flag]');
            end
            if ~hasFlagInit
              error('Murat_testData.m must initialize flag variable');
            end

            fprintf('MuRAT smoke test passed.\\n');
          "